apiVersion: v1
kind: Namespace
metadata:
  name: llmd-kind
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp
  namespace: llmd-kind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmd-llamacpp
  template:
    metadata:
      labels:
        app: llmd-llamacpp
    spec:
      containers:
        - name: llama-server
          image: local/llmd-llama:kind
          imagePullPolicy: Never
          args:
            - --model
            - /models/model.gguf
            - --alias
            - llmd-demo
            - --metrics
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --no-ui
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp
  namespace: llmd-kind
spec:
  selector:
    app: llmd-llamacpp
  ports:
    - name: http
      port: 8000
      targetPort: http
